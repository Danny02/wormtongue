name: Release

# Builds the macOS app and attaches the .app bundle to a GitHub Release.
#
# Trigger: publish a Release on github.com (Releases → Draft a new release) and
# pick an existing tag, then choose "Publish release". The runner builds and
# attaches the binary to that release.
#
# The runner is an Apple machine because the app target needs AppKit,
# Accessibility, AVFoundation, and WhisperKit, none of which build on Linux.
# No "Wormtongue Dev" cert exists on CI, so the app is signed ad-hoc (-). Users
# downloading it will get a Gatekeeper "unidentified developer" prompt and need
# to right-click → Open the first time.

on:
  release:
    types:
      - published

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use Apple's Xcode Swift toolchain (not the swift.org one): KeyboardShortcuts
      # 3.x relies on SwiftUI's @Entry macro, which only the Apple toolchain expands.
      # Pick the newest installed Xcode to match the local build (Swift 6.2).
      - name: Select newest Xcode toolchain
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            echo "Selecting $NEWEST"
            sudo xcode-select --switch "$NEWEST"
          fi
          swift --version

      - name: Build and sign app
        run: Scripts/bundle.sh release

      - name: Run core tests
        run: swift test -c release

      - name: Package app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="Wormtongue-macOS-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Wormtongue.app "$ZIP"
          echo "artifact=$ZIP" >> "$GITHUB_ENV"
          echo "Built $ZIP ($(du -h "$ZIP" | cut -f1))"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
          fail_on_unmatched_files: true
